# Traefik Dynamic Configuration
# Middlewares for security and optimization

http:
  middlewares:
    # Compression middleware
    compression:
      compress:
        excludedContentTypes:
          - "text/event-stream"

    # Security headers middleware
    security-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost"
          - "http://127.0.0.1:3000"
          - "http://127.0.0.1"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting middleware
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    # HTTPS redirect middleware (for production)
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

tls:
  # Wildcard cert for *.opentyme.k2o (and opentyme.k2o). The stable file names
  # local-dev.crt/.key are produced by scripts/generate-local-certs.sh so this
  # config stays domain-agnostic. Also set as the default certificate so any
  # request (including SNI-less / unexpected hosts) is served this cert instead
  # of Traefik's built-in self-signed "TRAEFIK DEFAULT CERT".
  stores:
    default:
      defaultCertificate:
        certFile: /letsencrypt/local/local-dev.crt
        keyFile: /letsencrypt/local/local-dev.key
  certificates:
    - certFile: /letsencrypt/local/local-dev.crt
      keyFile: /letsencrypt/local/local-dev.key
