name: CI

on:
  push:
    branches: [main]
  pull_request:

# Notes:
# - Required gates (must pass): backend type-check, frontend build, frontend unit tests.
# - Non-blocking gates (continue-on-error): lint and backend tests + frontend type-check.
#   These surface the existing backlog without blocking; promote them to required
#   once the backlog is cleared (remove the `continue-on-error: true` lines).

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: opentyme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
        continue-on-error: true # promote to required once validated in CI
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/opentyme_test
      - name: Lint
        run: npx eslint . --ext .ts,.js
        continue-on-error: true # promote to required once the lint backlog is cleared

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true # promote to required once the type backlog is cleared
      - name: Lint
        run: npx eslint . --ext js,jsx,ts,tsx
        continue-on-error: true # promote to required once the lint backlog is cleared
