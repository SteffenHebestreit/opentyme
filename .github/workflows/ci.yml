name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # so a run can be triggered without a dummy commit

# Notes:
# - Required gates (must pass): backend type-check, backend tests (unit +
#   integration, against the postgres service), backend + frontend lint,
#   frontend type-check, frontend build, frontend unit tests.
# - Lint policy: errors always fail. Warnings are capped by a RATCHET —
#   frontend `npm run lint` runs with --max-warnings 175 against a current count
#   of 168, so the number cannot grow unnoticed but the existing backlog does not
#   block the build. Lower the cap as the backlog is worked down; never raise it.
#   (It was --max-warnings 0, which contradicted this note and would have failed
#   the build on the pre-existing backlog the moment CI could run at all.)
# - The postgres service container starts before the checkout, so it cannot
#   mount init.sql the way docker-compose does; the backend job loads the
#   schema with psql inside the container before the tests run.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: opentyme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Load test database schema
        run: docker exec -i ${{ job.services.postgres.id }} psql -q -v ON_ERROR_STOP=1 -U postgres -d opentyme_test < ../init.sql
      - name: Tests (unit + integration)
        run: npx jest --ci --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/opentyme_test
      - name: Lint
        run: npx eslint . --ext .ts,.js

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --ext js,jsx,ts,tsx
